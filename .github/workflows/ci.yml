name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quants
          POSTGRES_PASSWORD: quants
          POSTGRES_DB: quants_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quants -d quants_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://quants:quants@localhost:5432/quants_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Tests that need a local validator skip themselves when none answers on 127.0.0.1:8899.
      - run: bun test --timeout 240000
